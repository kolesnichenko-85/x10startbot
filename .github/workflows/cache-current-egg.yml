name: Cache current premium egg
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache egg from current hatch config
        run: |
          mkdir -p app/static/assets
          python - <<'PY'
          import re, pathlib, urllib.request
          p=pathlib.Path("app/static/hatch_v2.js").read_text()
          m=re.search(r'const EGG="([^"]+)"', p)
          if not m:
              raise SystemExit("EGG URL not found")
          urllib.request.urlretrieve(m.group(1), "app/static/assets/primal-egg.png")
          PY
          test -s app/static/assets/primal-egg.png
      - name: Commit asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/assets/primal-egg.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cache premium primal egg asset"
          git push
