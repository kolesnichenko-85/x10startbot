      - name: Optimize to WebP
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          names=["fernhorn","cloudclaw","dune-runner","frostbite","solar-trike","ghost-talon","prism-diloph","ironjaw","thunder-ankyl","eclipse-spino","quantum-raptor","celestial-stego","alpha-zero","leviathan-spino","crown-titan","the-first","origin-beast"]
          out=Path("app/static/assets/species")
          for name in names:
              src=Path("/tmp")/(name+".jpg")
              assert src.exists() and src.stat().st_size>0, name
              im=Image.open(src).convert("RGB")
              im.thumbnail((900,900),Image.Resampling.LANCZOS)
              im.save(out/(name+".webp"),"WEBP",quality=84,method=6)
          PY
      - name: Commit final catalog art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/assets/species/*.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add remaining Primal Hatch catalog artwork"
          git push
