name: DROP1 Live Smoke
on:
  workflow_run:
    workflows: ["DROP1 Quality Gate"]
    types: [completed]
permissions:
  contents: read
jobs:
  live:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Wait for Render auto-deploy
        run: sleep 55
      - name: Live production smoke
        env:
          DROP1_LIVE_URL: https://drop1-game.onrender.com
        run: python scripts/live_smoke.py
