name: Cache DROP1 premium art
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Neon Raptor
        run: |
          mkdir -p app/static/assets
          curl -fL 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/3e2405ce-63e3-455b-8bd0-dc8cd71e177f.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZmZkMzAyNmZkMGI2OWI5YyIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTg3NDc5OX0.sKlQY7Y9pnEceycHpv5fko_6rZXLRsO9txl8mprncPw' -o app/static/assets/neon-raptor.png
          test -s app/static/assets/neon-raptor.png
      - name: Commit cached asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/assets/neon-raptor.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cache premium Neon Raptor asset"
          git push
