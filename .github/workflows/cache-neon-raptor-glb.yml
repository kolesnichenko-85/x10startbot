name: Cache Neon Raptor 3D
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download generated GLB
        run: |
          mkdir -p app/static/models
          curl -fL 'https://img.theapi.app/temp/0f784370-1fe7-4e1e-9ce3-e2f97aedd3ce.glb' -o app/static/models/neon-raptor.glb
          test -s app/static/models/neon-raptor.glb
      - name: Commit model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/models/neon-raptor.glb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add generated Neon Raptor GLB"
          git push
