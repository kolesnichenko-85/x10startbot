name: Cache DROP1 beta species
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache polished species
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import urllib.request, tempfile
          out=Path("app/static/assets/species")
          out.mkdir(parents=True, exist_ok=True)
          jobs=[]
          jobs.append(("https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/af15f36f-a442-489d-b28c-48762bdc5baa/145ff952-869e-4b86-97c4-f731646bce08/Premium_digital_collectible_creature_for_DROP1_Primal_Hatch_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODhhMmYzNTAwOWFjNjU0YyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTg3ODA5Nn0.cAoQvgbM8Fj6ro786YXDarzEeD9rnxun1kcf8dAxTh0", "moss-trike.webp"))
          jobs.append(("https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/f145a5d4-26a0-401d-a9eb-f80335828da4/f8181d66-17e7-40f5-95e1-ac1feef2bbac/Premium_digital_collectible_creature_for_DROP1_Primal_Hatch_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiM2I2NjcyNmU1MjU1ZDE2MiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTg5NDUxMH0.K0e6u8tFFiboSCradxJs7zUB99PUA8hYvAgrtFSLkyM", "crystal-ankyl.webp"))
          jobs.append(("https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/c453c9bb-cf51-4dbb-88ac-9aa0807b79e0/23b3ca19-8f46-46a9-a50e-6368f4e5a2cc/Premium_digital_collectible_creature_for_DROP1_Primal_Hatch_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZDYzYWU2MjJlNjEyM2RhZCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTg5MzAyNn0.6-VJa9BqrDZoz8g6cpTJtJc6FQWgGvjD625gG6rJjF4", "void-rex.webp"))
          jobs.append(("https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3-pro-image/images/c2f5093d-f153-4308-8360-57d42fb777e6/e5f0fea5-d71a-46cc-bfdd-388cb14c9243/Premium_digital_collectible_creature_for_DROP1_Primal_Hatch_.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjhkMDMzODNmYmFhY2U3MCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTg3NTcxNX0.q5o7PHrC1uTX3nA4pRzLFP3ZT52bZL6aP4nIYWXmW-8", "aurum-rex.webp"))
          for url,name in jobs:
              with tempfile.NamedTemporaryFile(suffix=".png") as f:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=60) as r:
                      f.write(r.read()); f.flush()
                  im=Image.open(f.name).convert("RGB")
                  im.thumbnail((900,900),Image.Resampling.LANCZOS)
                  im.save(out/name,"WEBP",quality=84,method=6)
          PY
      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/assets/species/*.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add polished Primal Hatch beta species"
          git push
