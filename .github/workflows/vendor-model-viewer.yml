name: Vendor model-viewer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned model-viewer
        run: |
          mkdir -p app/static/vendor
          curl --fail --location --retry 3 'https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js' -o app/static/vendor/model-viewer.min.js
          test -s app/static/vendor/model-viewer.min.js
      - name: Commit vendor asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/vendor/model-viewer.min.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Vendor pinned model-viewer runtime"
          git push
