name: Optimize DROP1 flagship assets
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize images for Telegram WebView
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          jobs=[
            ("app/static/assets/neon-raptor.png","app/static/assets/neon-raptor.webp",(900,1200)),
            ("app/static/assets/primal-egg.png","app/static/assets/primal-egg.webp",(900,900)),
          ]
          for src,dst,size in jobs:
              im=Image.open(src).convert("RGB")
              im.thumbnail(size, Image.Resampling.LANCZOS)
              im.save(dst,"WEBP",quality=82,method=6)
          PY
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/assets/*.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Optimize flagship assets for Telegram WebView"
          git push
