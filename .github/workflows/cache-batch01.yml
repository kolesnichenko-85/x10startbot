          curl --fail --location --retry 2 --user-agent 'Mozilla/5.0' --header 'Accept: image/avif,image/webp,image/apng,image/svg+xml,image/*,*/*;q=0.8' --header 'Referer: https://app.runwayml.com/' 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/6b71d40f-80d9-4cf0-b3f0-944c7a758742/d425ce16-51e2-4aa7-8e98-b1297075c131/DROP1_Primal_Hatch_creature_concept__Aurum_Rex__regal_tyrann.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMmY2M2FlZDZlMGYxZDE3YiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc4OTk1Nzk3NH0.6zP-l8q2UjR2E2HYjrnK0djXnV2l2r6ZIEp1ARYgBt4' -o app/static/assets/species/aurum-rex.jpg
          for f in app/static/assets/species/{ember-hatchling,pocket-raptor,tidejaw,suncrest,volt-stego,obsidian-spino,void-rex,aurora-quetzal,aurum-rex}.jpg; do test -s "$f"; done
      - name: Commit artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/static/assets/species/*.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Cache DROP1 Batch 01 creature art"
          git push
