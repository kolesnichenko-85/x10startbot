name: DROP1 Quality Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: drop1
          POSTGRES_PASSWORD: drop1
          POSTGRES_DB: drop1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drop1 -d drop1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q app
      - name: Product invariants
        run: python scripts/quality_gate.py
      - name: Frontend syntax and UX invariants
        run: python scripts/frontend_gate.py
      - name: SQLite API smoke test
        env:
          DEV_MODE: "true"
          FREE_TEST_MODE: "true"
          DATABASE_PATH: "/tmp/drop1_ci.db"
          BOT_TOKEN: "ci-not-a-real-token"
        run: python scripts/smoke_test.py
      - name: Postgres API smoke test
        env:
          DEV_MODE: "true"
          FREE_TEST_MODE: "true"
          DATABASE_URL: "postgresql://drop1:drop1@127.0.0.1:5432/drop1"
          BOT_TOKEN: "ci-not-a-real-token"
        run: python scripts/smoke_test.py
