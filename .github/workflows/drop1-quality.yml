name: DROP1 Quality Gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python syntax
        run: python -m compileall -q app
      - name: Product invariants
        run: python scripts/quality_gate.py
      - name: Frontend syntax and UX invariants
        run: python scripts/frontend_gate.py
      - name: API smoke test
        env:
          DEV_MODE: "true"
          FREE_TEST_MODE: "true"
          DATABASE_PATH: "/tmp/drop1_ci.db"
          BOT_TOKEN: "ci-not-a-real-token"
        run: |
          python -m pip install -r requirements.txt
          python scripts/smoke_test.py
